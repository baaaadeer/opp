<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Проект — БагТрекер</title>
    <link rel="stylesheet" href="../styles/main.css">
  </head>

  <body>
    <a class="skip" href="#main">К содержимому</a>

    <header>
      <a class="brand" href="../../index.html">
        <span class="logo">
          <img src="../../svg/icon.svg" alt="">
        </span>
        БагТрекер
      </a>

      <nav>
        <a href="../../index.html">Тикеты</a>
        <a href="projects.html" class="active" aria-current="page">Проекты</a>
      </nav>

      <div class="account">
        <a class="button" href="#profile">Профиль</a>
      </div>
    </header>

    <main id="main" class="container" tabindex="-1">
      <a class="back" href="projects.html">‹ Проекты</a>

      <div class="heading">
        <div>
          <h1>Проект</h1>
          <p class="muted"></p>
        </div>
      </div>

      <div class="columns">
        <section class="panel">
          <h2>Версии проекта</h2>

          <div>
            <div class="empty">
              <span class="empty-symbol" aria-hidden="true">◇</span>
              <p>Версий пока нет</p>
            </div>
          </div>
          <table id="versions-table" hidden>
            <thead>
              <tr>
                <th scope="col">Версия</th>
                <th scope="col">Статус</th>
              </tr>
            </thead>
            <tbody id="versions"></tbody>
          </table>
        </section>

        <aside class="panel">
          <h2>Участники</h2>

          <div>
            <div class="empty">
              <span class="empty-symbol" aria-hidden="true">◇</span>
              <p>Участников пока нет</p>
            </div>
          </div>
          <ul id="members"></ul>
        </aside>
      </div>
    </main>

    <section id="profile" class="modal" role="dialog" aria-modal="true" aria-labelledby="profile-title">
      <div class="modal-panel">
        <div class="heading">
          <h2 id="profile-title">Профиль</h2>
          <a class="button" href="#main" aria-label="Закрыть">×</a>
        </div>

        <div class="stack">
          <label>
            Имя
            <input name="name" autocomplete="name" required>
          </label>
          <label>
            Email
            <input name="email" type="email" autocomplete="email" required>
          </label>
          <p class="error" role="alert"></p>

          <div class="actions">
            <a class="button" href="#main">Отмена</a>
            <button type="button" class="primary">Сохранить</button>
          </div>
        </div>
      </div>
    </section>
  </body>
</html>
