name: bugtracker

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: bugtracker
      POSTGRES_USER: ${DB_USER:-bugtracker}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-bugtracker}
    ports:
      - "${DB_PORT:-5434}:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d bugtracker"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://db:5432/bugtracker
      DB_USER: ${DB_USER:-bugtracker}
      DB_PASSWORD: ${DB_PASSWORD:-bugtracker}
    ports:
      - "${APP_PORT:-8081}:8081"

volumes:
  db-data:
