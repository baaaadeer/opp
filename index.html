<!doctype html>
<html lang="ru">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Тикеты — БагТрекер</title>
  <link rel="stylesheet" href="src/styles/main.css">
</head>

<body>
  <a class="skip" href="#main">К содержимому</a>

  <header>
    <a class="brand" href="index.html"><span class="logo"><img src="svg/icon.svg" alt=""></span>БагТрекер</a>
    <nav>
      <a href="index.html" class="active" aria-current="page">Тикеты</a>
      <a href="src/pages/projects.html">Проекты</a>
    </nav>
    <div class="account"><a class="button" href="#profile">Профиль</a></div>
  </header>
  <main id="main" class="container" tabindex="-1">
    <div class="heading">
      <div>
        <h1>Тикеты</h1>
        <p class="muted">Баги проектов, в которых вы участвуете</p>
      </div>

      <a class="button primary" href="src/pages/ticket-form.html">＋ Создать тикет</a>
    </div>

    <div class="tabs" role="group">
      <button class="active" aria-pressed="true">Все</button>
      <button aria-pressed="false">Созданные мной</button>
      <button aria-pressed="false">Назначенные мне</button>
      <button aria-pressed="false">Черновики</button>
    </div>

    <div id="filters" class="filters">
      <label>Поиск<input name="search" type="search"></label>

      <label>Проект<select name="projectId">
          <option value="">Все проекты</option>
        </select></label>

      <label>Статус
        <select name="status">
          <option value="">Все статусы</option>
        </select>
      </label>

      <label>Приоритет
        <select name="priority">
          <option value="">Все приоритеты</option>
        </select>
      </label>

      <label>Ответственный
        <select name="assigneeId">
          <option value="">Все участники</option>
        </select>
      </label>
      <button type="reset">Сбросить</button>

    </div>
    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th scope="col">ID</th>
            <th scope="col">Название</th>
            <th scope="col">Приоритет</th>
            <th scope="col">Проект · версия</th>
            <th scope="col">Статус</th>
            <th scope="col">Ответственный</th>
            <th scope="col">Дедлайн</th>
          </tr>
        </thead>
        <tbody>
          <tr>
            <td colspan="7">
              <div class="empty"><span class="empty-symbol" aria-hidden="true">◇</span>
                <p>Тикетов пока нет</p>
              </div>
            </td>
          </tr>
        </tbody>
      </table>
    </div>

    <p class="muted">Всего: <span id="count">0</span></p>
  </main>
  <section id="profile" class="modal" role="dialog" aria-modal="true" aria-labelledby="profile-title">
    <div class="modal-panel">
      <div class="heading">
        <h2 id="profile-title">Профиль</h2><a class="button" href="#main" aria-label="Закрыть">×</a>
      </div>
      <div class="stack">
        <label>Имя<input name="name" autocomplete="name" required></label>
        <label>Email<input name="email" type="email" autocomplete="email" required></label>

        <p class="error" role="alert"></p>
        <div class="actions"><a class="button" href="#main">Отмена</a><button type="button"
            class="primary">Сохранить</button></div>
      </div>
    </div>
  </section>
</body>

</html>
