server:
  port: ${APP_PORT:8081}

spring:
  application:
    name: bugtracker
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5434/bugtracker}
    username: ${DB_USER:bugtracker}
    password: ${DB_PASSWORD:bugtracker}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration

management:
  endpoints:
    web:
      exposure:
        include: health,info
